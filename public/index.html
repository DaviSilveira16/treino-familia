<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101312" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-v2.png?v=20261023-audit2"
    />
    <link rel="manifest" href="/manifest.json?v=20261023-audit2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Treino Família" />
    <title>%WEB_TITLE%</title>

    <style id="expo-reset">
      html {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #111613;
      }

      body {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        width: 100%;
        height: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        background-color: #111613;
      }

      #root,
      #root * {
        touch-action: pan-y;
      }

      #root [style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }

      #root {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: auto;
        height: auto;
        min-height: 0;
        overflow: hidden;
        background-color: #111613;
      }

      #app-conteudo {
        box-sizing: border-box !important;
        min-height: 0 !important;
        padding-top: env(safe-area-inset-top, 0px) !important;
        overflow: hidden;
      }

      /* A barra permanece com altura própria de 62 px, sem somar a área segura
         ao tamanho do componente. A área do indicador do iPhone usa o mesmo
         fundo da navegação para não parecer uma faixa preta separada. */
      #navegacao-inferior {
        box-sizing: border-box !important;
        height: 30px !important;
        min-height: 30px !important;
        padding-bottom: 0 !important;
        margin-bottom: 0 !important;
        flex-shrink: 0 !important;
        background-color: #111613 !important;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
