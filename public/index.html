<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101312" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-v2.png?v=20261023-audit2"
    />
    <link rel="manifest" href="/manifest.json?v=20261023-audit2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Treino Família" />
    <title>%WEB_TITLE%</title>

    <style id="expo-reset">
      html,
      body {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #101312;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      #root,
      #root * {
        touch-action: pan-y;
      }

      #root [style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }

      #root {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background-color: #101312;
      }

      /* O conteúdo fica abaixo dos indicadores do iPhone, sem sobrepor os botões de voltar. */
      #app-conteudo {
        box-sizing: border-box !important;
        min-height: 0 !important;
        padding-top: env(safe-area-inset-top, 0px) !important;
        overflow: hidden;
      }

      @supports (height: 100dvh) {
        body,
        #root {
          height: 100dvh;
          min-height: 100dvh;
        }
      }

      #navegacao-inferior {
        box-sizing: border-box !important;
        height: calc(58px + env(safe-area-inset-bottom, 0px)) !important;
        min-height: calc(58px + env(safe-area-inset-bottom, 0px)) !important;
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
