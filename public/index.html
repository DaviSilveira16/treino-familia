<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111312" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Treino Família" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-v2.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>%WEB_TITLE%</title>

    <style id="expo-reset">
      /* O Safari instalado gerencia a barra de status: nada de body fixo
         ou padding-top duplicado. Isso evita a faixa extra no rodapé. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #111613;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #root {
        display: flex;
        flex: 1;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        box-sizing: border-box;
        background: #101312;
      }
      /* Navegação compacta até o limite que o Safari disponibiliza.
         O espaço de segurança do indicador de início fica DENTRO da barra. */
      #navegacao-inferior {
        box-sizing: border-box !important;
        height: calc(50px + env(safe-area-inset-bottom, 0px)) !important;
        min-height: calc(50px + env(safe-area-inset-bottom, 0px)) !important;
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
        padding-top: 0 !important;
        flex-shrink: 0 !important;
        background: #111613 !important;
      }
    </style>
  </head>
  <body>
    <noscript
      >É necessário habilitar JavaScript para usar o Treino Família.</noscript
    >
    <div id="root"></div>
  </body>
</html>
