<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111613" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-v3.png"
    />
    <link rel="manifest" href="/manifest.json?v=20261023" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Treino Família" />
    <title>%WEB_TITLE%</title>

    <style id="expo-reset">
      html,
      body {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #101312;
      }

      html {
        min-height: 100%;
      }

      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      #root {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: #101312;
      }

      #root [style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }

      #navegacao-inferior {
        box-sizing: border-box !important;
        height: calc(40px + env(safe-area-inset-bottom, 0px)) !important;
        min-height: calc(40px + env(safe-area-inset-bottom, 0px)) !important;
        padding-top: 0 !important;
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
        margin: 0 !important;
        flex-shrink: 0 !important;
        background-color: #111613 !important;
        border-bottom: 0 !important;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
