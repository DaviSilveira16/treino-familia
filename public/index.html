<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111312" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Treino Família" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-v2.png"
    />
    <!-- Sem manifest nem service worker: não há instalação PWA convencional.
         O atalho do Safari continua abrindo sem as barras do navegador no iPhone. -->
    <title>%WEB_TITLE%</title>

    <style id="expo-reset">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #111312;
        overscroll-behavior: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        box-sizing: border-box;
        background-color: #111312;
        /* No atalho do iPhone, desenha o fundo atrás do relógio,
           mantendo os componentes abaixo da barra de status. */
        padding-top: env(safe-area-inset-top, 0px);
      }
      /* A barra fica na base real da viewport. O espaço do indicador
         de início pertence à barra, e nunca vira uma faixa externa. */
      #navegacao-inferior {
        height: calc(60px + env(safe-area-inset-bottom, 0px)) !important;
        min-height: calc(60px + env(safe-area-inset-bottom, 0px)) !important;
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
        box-sizing: border-box !important;
        flex-shrink: 0 !important;
        background-color: #111612 !important;
      }
    </style>
  </head>
  <body>
    <noscript
      >É necessário habilitar JavaScript para usar o Treino Família.</noscript
    >
    <div id="root"></div>
  </body>
</html>
