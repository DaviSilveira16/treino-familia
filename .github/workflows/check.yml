name: Verificar projeto web
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar esta revisão na Vercel depois dos testes
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:43119
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:sql
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run test:ui
        env:
          SMOKE_BROWSER: webkit
      - name: Fotos ao salvar novo treino
        run: npm run test:ui
        env:
          SMOKE_MODEL_PHOTOS_ONLY: '1'
      - name: Próximo treino com foto pendente
        run: npm run test:ui
        env:
          SMOKE_PHOTO_RETRY_ONLY: '1'
      - name: Diário de nutrição
        run: npm run test:nutricao:ui
      - name: Painel, programação, lembretes e CSV
        run: npm run test:ui
        env:
          SMOKE_PAINEL_ONLY: '1'
      - name: Painel e reabertura no WebKit
        run: npm run test:ui
        env:
          SMOKE_BROWSER: webkit
          SMOKE_PAINEL_ONLY: '1'
      - name: Paginação e rolagem de Meus treinos
        run: npm run test:ui
        env:
          SMOKE_SCROLLS_ONLY: '1'
  publicar:
    needs: verificar
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publicar))
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: vercel-production
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Publicar revisão validada
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          main_remota=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${main_remota%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "A main já tem uma revisão mais recente. Publicação ignorada."
            exit 0
          fi
          : "${VERCEL_TOKEN:?Configure o secret VERCEL_TOKEN no ambiente Production do GitHub}"
          : "${VERCEL_ORG_ID:?Configure a variável VERCEL_ORG_ID no ambiente Production do GitHub}"
          : "${VERCEL_PROJECT_ID:?Configure a variável VERCEL_PROJECT_ID no ambiente Production do GitHub}"
          npx --yes vercel@65.16.0 deploy --prod --yes --token "$VERCEL_TOKEN"
